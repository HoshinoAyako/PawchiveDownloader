name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Windows smoke test
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source
        shell: pwsh
        run: python -m compileall -q pawchive tools

      - name: Run smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/ci | Out-Null
          python tools/smoke_test.py 2>&1 | Tee-Object -FilePath build/ci/smoke.log
          exit $LASTEXITCODE

      - name: Analyze smoke log
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/ci | Out-Null
          if (-not (Test-Path build/ci/smoke.log)) {
            "[SMOKE] SUMMARY total=0 passed=0 failed=1 duration_ms=0" |
              Set-Content -LiteralPath build/ci/smoke.log -Encoding utf8
            "烟雾测试未产生日志，请检查 Python 与依赖安装。" |
              Add-Content -LiteralPath build/ci/smoke.log -Encoding utf8
          }
          python tools/ci_log_agent.py build/ci/smoke.log `
            --report build/ci/ci-report.md `
            --summary $env:GITHUB_STEP_SUMMARY

      - name: Upload CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: build/ci/
          if-no-files-found: warn
          retention-days: 14
